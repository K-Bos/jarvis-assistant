services:
  jarvis-assistant:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: jarvis-assistant:local
    restart: unless-stopped
    ports:
      - "8082:80"
    labels:
      com.kbdigital.product: jarvis-assistant
      com.kbdigital.logs: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health.html >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

