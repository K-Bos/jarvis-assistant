<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JARVIS Assistant</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
        color: #e0f2fe;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(14, 165, 233, 0.32), transparent 34rem),
          radial-gradient(circle at bottom right, rgba(79, 70, 229, 0.34), transparent 28rem),
          #020617;
      }
      main {
        width: min(52rem, calc(100% - 2rem));
        padding: 3rem;
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 2rem;
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      p {
        color: #bae6fd;
        line-height: 1.7;
      }
      .badge {
        display: inline-flex;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(14, 165, 233, 0.14);
        color: #7dd3fc;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">KB Digital product candidate</span>
      <h1>JARVIS Assistant</h1>
      <p>
        AI personal assistant voor context, taken, planning, kennis en veilige automatisering.
      </p>
      <p>
        Deze placeholder draait alvast via de standaard Coolify-ready productstructuur.
      </p>
    </main>
  </body>
</html>
