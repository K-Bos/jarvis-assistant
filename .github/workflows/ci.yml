name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f docs/product.md
          test -f docs/architecture.md
          test -f docs/development.md
          test -f docs/operations.md
          test -f docs/roadmap.md

